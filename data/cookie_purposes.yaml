# Propósito de una cookie según su NOMBRE conocido (v1.4.6, docs/adr/033).
#
# Es INFERENCIA: el nombre no prueba qué guarda ni para qué se usa; un sitio puede llamar «session» a
# cualquier cosa. Se aplica a todas las cookies de la visita, también a las del propio dominio.
#   funcional  : necesarias para que el sitio funcione (sesión, antibot, idioma, carrito). NO suman al
#                índice de exposición (componente stored_items).
#   analitica  : medición de visitas.
#   publicidad : publicidad y conversiones.
# Dos pasos (v1.4.7), ambos INFERENCIA:
#   (a) por el NOMBRE conocido (`purposes`);
#   (b) si el nombre no está, por el TIPO DE SERVICIO de la organización dueña del dominio de la cookie
#       (`by_service_type`, tipos de service_types.yaml). Una cookie del propio dominio la puede haber creado
#       un script de terceros: ahí cuenta la organización del sitio, que normalmente no tiene tipo.
# Sin nombre conocido ni tipo: «sin clasificar» (no se inventa un propósito); sigue contando en el índice.
#
# Coincidencia sin distinguir mayúsculas: nombre exacto, o patrón con «*» (cualquier texto). Se evalúan en
# el orden de `order`; gana la primera regla que coincide.
version: 1

order: [publicidad, analitica, funcional]

labels:
  funcional: "funcional"
  analitica: "analítica"
  publicidad: "publicidad"
  sin_clasificar: "sin clasificar"

purposes:
  funcional:
    - session
    - sessionid
    - session_id
    # Sesión de frameworks conocidos. NO «*_session»: appier_session o taboola_session_id son de publicidad.
    - laravel_session
    - ci_session
    - "wp_woocommerce_session_*"
    - PHPSESSID
    - JSESSIONID
    - ASP.NET_SessionId
    - cf_clearance
    - __cf_bm
    - lang
    - language
    - idioma
    - locale
    - "*_lang"
    - "*_language"
    - "*_idioma"
    - cart
    - carrito
    - "*_cart"
    - "cart_*"
    - "*_carrito"
    - woocommerce_cart_hash
    - woocommerce_items_in_cart
    # v1.4.7: Alibaba / AliExpress — país, idioma y moneda, sesión y token de la API móvil.
    - aep_usuc_f
    - intl_locale
    - xman_us_f
    - _m_h5_tk
    # Alibaba — seguridad (antifraude y antibot): se cuentan como funcionales.
    - isg
    - tfstk
    - l
  analitica:
    - _ga
    - _gid
    - "_ga_*"
    - _clck
    - _clsk
    - "_hj*"
    # v1.4.7: Alibaba — identificador de visitante de su analítica.
    - cna
    - ali_apache_id
  publicidad:
    - _fbp
    - _fbc
    - _gcl_au
    - _ttp
    - IDE
    - test_cookie
    # v1.4.7: adtech común (Criteo, Microsoft Ads, The Trade Desk, Yahoo).
    - cto_bundle
    - MUID
    - _uetsid
    - _uetvid
    - tuuid
    - A3

# v1.4.8: nombres cortos y genéricos que otros sitios también usan. Por el nombre solo se clasifican si la
# cookie es de uno de estos dominios (sufijo); si no, pasan al paso (b) o quedan «sin clasificar».
name_domains:
  l: [alibaba.com, aliexpress.com, alicdn.com, mmstat.com]
  cna: [alibaba.com, aliexpress.com, alicdn.com, mmstat.com]

# Paso (b): tipo de servicio de la organización que creó la cookie → propósito.
by_service_type:
  publicidad: [advertising, mobile_advertising, conversion_pixel, ad_attribution, server_side_meta, dmp, data_broker]
  analitica: [analytics, audience_measurement, session_recording, cms_analytics]
  funcional: [cdn, library_cdn, antifraud]

basis_labels:
  nombre: "por el nombre"
  organizacion: "por la organización"
