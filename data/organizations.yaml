# Catálogo propio de organizaciones (v1.4.5, docs/adr/032).
#
# Complementa el mapa de entidades (DuckDuckGo Tracker Radar o AdGuard companiesdb), que busca por
# dominio registrable y por eso no ve los hosts que cuelgan de un sufijo público (p. ej.
# maps.googleapis.com: «googleapis.com» está en la Public Suffix List). También evita mostrar como
# «organización» el nombre de una persona natural que registró un dominio.
#
# El tipo de servicio de cada host (mapas, fuentes, CDN de librerías…) vive en service_types.yaml.
version: 1

# Organización → sufijos de host. Un host es de la organización si es igual al sufijo o termina en
# «.<sufijo>». Gana sobre el mapa de entidades. El nombre debe ser el mismo que usa el mapa
# («Google», no «Google LLC»), para que sus dominios se agrupen juntos.
organizations:
  Google: [googleapis.com]
  # v1.4.6: widget de accesibilidad (cdn.userway.org, api.userway.org): una sola organización.
  UserWay: [userway.org]
  # v1.4.8: Liferay (DXP y Analytics Cloud) y Podscribe (atribución de publicidad en podcasts).
  Liferay: [lfr.cloud, liferay.com]
  Podscribe: [pdscrb.com]

# CDN públicos de librerías (v1.4.6, docs/adr/033). La empresa dueña del CDN (p. ej. Prospect One por
# jsDelivr) no es quien escribió el script: el recurso se atribuye a la librería, leída de la RUTA de la URL
# (`prefixes`: lo que sigue es el nombre del paquete, con @scope si lo tiene, sin la versión). `segments: 2`
# toma dos tramos (usuario/repositorio en /gh/). Si la ruta no permite leer el paquete: «librería en CDN
# público (<cdn>)». Si la ruta coincide con benign_libraries.yaml, la librería se marca como conocida.
public_cdns:
  - name: jsDelivr
    hosts: [cdn.jsdelivr.net, fastly.jsdelivr.net, gcore.jsdelivr.net, testingcf.jsdelivr.net, quantil.jsdelivr.net]
    prefixes:
      - {prefix: /npm/}
      - {prefix: /gh/, segments: 2}
  - name: cdnjs
    hosts: [cdnjs.cloudflare.com]
    prefixes:
      - {prefix: /ajax/libs/}
  - name: unpkg
    hosts: [unpkg.com]
    prefixes:
      - {prefix: /}

# Dominios cuya organización NO se conoce con certeza: se muestra «no disponible» aunque el mapa de
# entidades traiga un nombre (p. ej. el de la persona que registró el dominio).
unknown: [weshareapp.io, e-mailit.com]

# Personas naturales (v1.4.5): el mapa de entidades trae a veces, como dueño de un dominio, el nombre
# de la persona que lo registró. Nunca se muestra: la organización queda «no disponible».
#
# Un nombre del mapa con 2 a 4 palabras solo de letras se evalúa en este orden:
#   1. lleva una forma jurídica (legal_forms: Inc, GmbH, Ltda…)            → organización;
#   2. lleva un término de organización (org_words: Media, Bank…)          → organización;
#   3. alguna palabra es un nombre de pila conocido (given_names)          → persona;
#   4. se parece a uno de sus dominios, o la entidad tiene 3 o más dominios → organización;
#   5. en otro caso                                                         → persona.
# El paso 5 prefiere perder el nombre de una empresa pequeña antes que mostrar el de una persona.
persons:
  # Entidades que el criterio anterior confundiría con una persona y son organizaciones.
  not_persons: [Taylor and Francis, Prospect One, Yandex Metrica, Lucky Orange, Rubicon Project, Index Exchange, The Trade Desk,
                Trade Desk, Hotjar, Automattic, New Relic, Sovrn Holdings, Oath, Verizon Media, Conde Nast]
