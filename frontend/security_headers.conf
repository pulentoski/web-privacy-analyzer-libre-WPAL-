# Cabeceras de seguridad. Se incluyen en cada location que define add_header propio
# (en nginx, un add_header en un location anula los heredados).
#
# La interfaz muestra datos capturados de sitios no confiables. Además de pintarlos
# siempre como texto, la CSP impide que algo inyectado llegue a ejecutarse:
# sin scripts ni estilos inline, sin eval, sin recursos externos, sin frames.
# Única excepción en connect-src: api.ipify.org, que el navegador solo contacta si el
# visitante pulsa el botón opt-in "ver mi IP pública" de Mi exposición.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.ipify.org; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
