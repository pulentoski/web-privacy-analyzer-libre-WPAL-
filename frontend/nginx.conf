# Log de acceso mínimo: sin IP, sin User-Agent y sin query string ($uri no la incluye).
# La página "Mi exposición" promete que el servidor no guarda nada del visitante.
log_format minimal '$time_iso8601 $request_method $uri $status';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log minimal;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security_headers.conf;

    client_max_body_size 1m;

    location = /mode.json {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security_headers.conf;
        return 200 '{"mode":"full"}';
    }

    location = /health {
        proxy_pass http://api:8000/health;
        include /etc/nginx/proxy_api.conf;
    }

    # Mi exposición: ni siquiera el log mínimo.
    location /api/exposure/ {
        access_log off;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_api.conf;
    }

    # Importar HAR (v1.3): único endpoint que acepta cuerpos grandes (la api corta a los 50 MB).
    location /api/har/ {
        client_max_body_size 50m;
        client_body_timeout 120s;
        proxy_request_buffering off;
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_api.conf;
    }

    # Captura interactiva (v1.4, docs/adr/029): WebSocket de noVNC hacia el relé de la api. Sin log
    # (ni el mínimo) y con timeouts largos: una pantalla quieta no genera tráfico.
    location ~ ^/api/interactive/[0-9a-f-]+/ws$ {
        access_log off;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        # Host con puerto, tal como lo envió el navegador: la api lo compara con Origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 1900s;
        proxy_send_timeout 1900s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://api:8000;
        include /etc/nginx/proxy_api.conf;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security_headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}

# Modo exposición por HTTP. Siempre existe dentro del contenedor, pero el puerto solo se
# publica (en la IP LAN) con DEMO_MODE=exposure. La variante HTTPS está en
# nginx.exposure-tls.conf, que se monta junto con el certificado en ese mismo modo.
server {
    listen 8081;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log minimal;
    client_max_body_size 64k;
    include /etc/nginx/exposure_locations.conf;
}

# Indicador de recursos (v1.4): la muestra de cgroup de ESTE contenedor, que escribe
# report-resources.sh. Puerto interno: no se publica en el host; lo consulta la api.
server {
    listen 8082;
    server_name _;
    server_tokens off;
    access_log off;
    location = /resources.json {
        alias /tmp/resources.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / { return 404; }
}
