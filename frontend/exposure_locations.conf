# Lo ÚNICO que sirve el modo exposición (DEMO_MODE=exposure): la página "Mi exposición" y
# sus endpoints. La API de scans y todo lo demás responde 403: desde la red local no se
# pueden lanzar scans ni leer resultados.
include /etc/nginx/api_upstream.conf;
root /usr/share/nginx/html;
index index.html;
include /etc/nginx/security_headers.conf;

# La interfaz pregunta en qué modo está y, en este, solo muestra "Mi exposición".
location = /mode.json {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/security_headers.conf;
    return 200 '{"mode":"exposure"}';
}

location /api/exposure/ {
    access_log off;
    proxy_pass $api_upstream;
    include /etc/nginx/proxy_api.conf;
}

location /api/ {
    default_type application/json;
    return 403 '{"error_code":"NOT_AVAILABLE_IN_EXPOSURE_MODE","message":"En modo exposición solo está disponible la página Mi exposición.","details":{},"stage":"demo"}';
}

location = /health {
    return 404;
}

location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/security_headers.conf;
    try_files $uri =404;
}

location / {
    try_files $uri /index.html;
}
