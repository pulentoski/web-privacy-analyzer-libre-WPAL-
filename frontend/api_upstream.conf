# La api por su nombre, resuelto en cada request con el DNS de Docker (v1.5.2). Con `proxy_pass http://api:8000`
# nginx resolvía «api» una sola vez al arrancar: si la api se recreaba con otra IP, el frontend seguía enviando a la
# IP anterior (502 o, peor, a otro contenedor que la heredó). Se incluye en cada server que reenvía a la api.
resolver 127.0.0.11 valid=10s ipv6=off;
set $api_upstream http://api:8000;
