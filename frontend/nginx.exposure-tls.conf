# Modo exposición por HTTPS con certificado autofirmado (docs/adr/012).
# Este archivo y el certificado solo se montan con DEMO_MODE=exposure (scripts/demo.sh).
# La clave privada vive en .demo-certs/, fuera del repositorio.
server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log minimal;
    client_max_body_size 64k;

    ssl_certificate /etc/nginx/certs/demo.crt;
    ssl_certificate_key /etc/nginx/certs/demo.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache off;
    ssl_session_tickets off;

    include /etc/nginx/exposure_locations.conf;
}
