# SOLO para el servicio frontend-vulnerable (perfil test, sin puertos publicados).
# Sirve el build que incluye la vista deliberadamente vulnerable, de dos formas:
#   :8080 con la misma CSP que producción  -> la CSP debe bloquear y reportar la inyección
#   :8081 SIN CSP                          -> el payload se ejecuta; el detector debe verlo
log_format minimal '$time_iso8601 $request_method $uri $status';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log minimal;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/security_headers.conf;
    location = /health { proxy_pass http://api:8000/health; include /etc/nginx/proxy_api.conf; }
    location /api/ { proxy_pass http://api:8000; include /etc/nginx/proxy_api.conf; }
    location / { try_files $uri /index.html; }
}

server {
    listen 8081;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log minimal;
    root /usr/share/nginx/html;
    index index.html;
    location = /health { proxy_pass http://api:8000/health; include /etc/nginx/proxy_api.conf; }
    location /api/ { proxy_pass http://api:8000; include /etc/nginx/proxy_api.conf; }
    location / { try_files $uri /index.html; }
}
